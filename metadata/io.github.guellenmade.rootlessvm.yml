Name: RootlessVM
Summary: Virtualized Android with root and Xposed inside the VM, on unrooted hosts
Description: |-
    RootlessVM runs a complete proot-based Android environment inside an
    unrooted host app. Inside the container the user has root (su with
    per-app grant/deny) and a working Xposed framework built from the
    Vector source code (legacy Xposed API + modern libxposed API).
    The host device is never modified.

    * GPL-3.0-or-later, no trackers, no proprietary images.
    * Container apps appear as launcher shortcuts (adaptive icons).
    * Software rendering (llvmpipe) with honest performance reporting;
      AVF/pKVM fast path is detected and documented as roadmap.

