name: Vector artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  vector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-33" "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Replace SDK ninja with >= 1.11 (C++20 module scan requirement)
        run: |
          pip install --quiet ninja
          NEW_NINJA="$(python3 -c 'import ninja, os; print(os.path.join(os.path.dirname(ninja.__file__), "data", "bin"))')/ninja" 2>/dev/null || true
          # pip wheel installs the binary on PATH
          cp "$(command -v ninja)" "$ANDROID_HOME/cmake/3.31.5/bin/ninja"
          "$ANDROID_HOME/cmake/3.31.5/bin/ninja" --version
      - name: Build Vector injection artifacts (pinned commit)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          vector/build_vector.sh "$GITHUB_WORKSPACE/vector-work" 33 "$ANDROID_NDK_HOME"

      - name: Build proot (arm64)
        run: |
          export PATH="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          proot/build_proot.sh "$GITHUB_WORKSPACE/proot-work" arm64-v8a || echo "::warning::proot build needs Android NDK toolchain in PATH"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-artifacts
          path: |
            vector-work/out/**
            proot-work/out/**
          if-no-files-found: warn
