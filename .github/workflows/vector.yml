name: Vector artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  vector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Vector injection artifacts (pinned commit)
        run: |
          vector/build_vector.sh "$GITHUB_WORKSPACE/vector-work" 33 "$ANDROID_HOME/ndk-bundle" || true
          if [ ! -f "$GITHUB_WORKSPACE/vector-work/out/artifact-manifest.json" ]; then
            echo "::warning::Vector build did not produce artifacts (upstream layout drift); job continues to record the pinned manifest only"
          fi

      - name: Build proot (arm64)
        run: proot/build_proot.sh "$GITHUB_WORKSPACE/proot-work" arm64-v8a || echo "::warning::proot build needs Android NDK toolchain in PATH"

      - name: Upload Vector artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-artifacts
          path: |
            vector-work/out/**
            proot-work/out/**
          if-no-files-found: warn
