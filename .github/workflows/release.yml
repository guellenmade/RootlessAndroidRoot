name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (pinned 8.14, required by AGP 8.x)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Decode signing keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/rootlessvm-release.keystore"
            echo "ROOTLESSVM_KEYSTORE=$RUNNER_TEMP/rootlessvm-release.keystore" >> "$GITHUB_ENV"
            echo "ROOTLESSVM_KEYSTORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 not set; building debug-signed APK"
          fi

      - name: Bundle proot binaries into APK assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "app/src/main/jniLibs/${abi}"
            gh release download "proot-${abi}" --repo "$GITHUB_REPOSITORY" \
              --pattern proot --output "app/src/main/jniLibs/${abi}/libproot.so"
            chmod +x "app/src/main/jniLibs/${abi}/libproot.so"
          done
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/RootlessVM-v${GITHUB_REF_NAME}.apk

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
