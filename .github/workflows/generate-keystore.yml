name: Generate signing keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore rootlessvm-release.keystore \
            -storetype PKCS12 \
            -alias rootlessvm \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -keypass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -dname "CN=RootlessVM, OU=RootlessAndroidRoot, O=guellenmade, C=DE"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: rootlessvm-release.keystore
